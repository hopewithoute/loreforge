[project]
name = "loreforge-backend"
version = "0.1.0"
description = "Backend API for the LoreForge game concept world builder"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "httpx2>=2.6.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=8.4,<10",
    "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C4",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PIE",
    "PT",
    "PTH",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Cookie", "fastapi.Body", "fastapi.File"]
